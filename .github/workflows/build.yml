name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The whole solution is plain net8.0 and builds on Linux, Avalonia included, so the
      # checks run on a cheap runner. MetaRestoreGeek.Core carries the part worth proving - the
      # Takeout filename matching, the JSON sidecar parsing, and a real end-to-end exiftool
      # write-then-read-back, since this runner has exiftool available via apt - and none of
      # that touches Windows.
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Build
        run: dotnet build MetaRestoreGeek.sln -c Release

      - name: Test
        run: dotnet run --project tests/MetaRestoreGeek.Tests -c Release --no-build
